# vendor/esm: git clone https://github.com/Biohub/esm vendor/esm  (run at fddac936)
# Runs start from a clean committed tree. Name the run first:
#   git log -1 --format=%cd-%h --date=format:%Y%m%d > COMMIT
# sky launch -c argus sky.yaml --env INPUT=swissprot-biohub --env HF_REPO=<user>/<dataset> --secret HF_TOKEN -i 60 --down
#   runs every operation, uploads out/ to the dataset, and tears the machine down an hour after it goes idle.
#   Leave out -i and --down to keep the machine up; add --retry-until-up to wait for capacity.
name: argus
resources:
  cloud: lambda
  any_of:
    - accelerators: H100:4
    - accelerators: A100-80GB:8
    - accelerators: H100:2
    - accelerators: H100:8
workdir: .
envs:
  INPUT: swissprot-random
  HF_REPO: ""
secrets:
  HF_TOKEN: ""
setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  ~/.local/bin/uv venv ~/venv --python 3.12
  source ~/venv/bin/activate
  ~/.local/bin/uv pip install -e vendor/esm pyarrow hf_transfer
  ~/.local/bin/uv pip install --reinstall-package torch "torch>=2.11" --index-url https://download.pytorch.org/whl/cu128
  HF_HUB_ENABLE_HF_TRANSFER=1 hf download biohub/ESMC-6B
  HF_HUB_ENABLE_HF_TRANSFER=1 hf download biohub/ESMC-6B-sae-layer60-k64-codebook16384
run: |
  source ~/venv/bin/activate
  mkdir -p out && hf download $HF_REPO runs.jsonl --repo-type dataset --local-dir out
  ./pipeline.sh $INPUT && cp inputs/$INPUT/*.json out/$INPUT/ && hf upload $HF_REPO out . --repo-type dataset --exclude "*/shard*/*" --exclude "*-shard*"
